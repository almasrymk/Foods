name: foods_app
description: "Foods - plan your month meals and get the shopping list."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  cached_network_image: ^4.0.7
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.4
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.3
  material_ui: ^1.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/home/
    - assets/images/art/
    - assets/family/
    - assets/screens/art/
    - assets/screens/cuisines/
    - assets/screens/details/
    - assets/screens/foods/
    - assets/screens/ingredients/
    - assets/screens/orders/
    - assets/screens/plan/
    - assets/screens/purchase/
    - assets/screens/settings/
    - assets/screens/shared/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
